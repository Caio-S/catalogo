<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14181B">
<title>Login — Gestão de Peças CH570</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;overflow:hidden}
  #dotfield{position:fixed;inset:0;width:100%;height:100%;z-index:1}
  #dotfieldGlow{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
  .loginbox{position:relative;z-index:2;width:100%;max-width:380px;background:linear-gradient(165deg,rgba(46,56,62,.55),rgba(29,35,39,.75));
    backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid rgba(255,255,255,.14);border-top:1px solid rgba(150,220,130,.55);border-radius:14px;
    box-shadow:0 25px 60px -12px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.08);
    padding:32px 30px;animation:pop .28s cubic-bezier(.25,.85,.4,1.15)}
  .loginbox .logo{display:block;max-width:220px;margin:0 auto 22px}
  .loginbox h1{font-family:var(--disp);font-weight:700;font-size:20px;text-transform:uppercase;text-align:center;letter-spacing:.06em;margin-bottom:4px}
  .loginbox .sub{color:var(--mut);font-size:12.5px;text-align:center;margin-bottom:24px}
  .lfld{margin-bottom:14px}
  .lfld label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
  .lfld input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--txt);
    padding:11px 12px;font-family:var(--body);font-size:14px;outline:none;transition:border .15s}
  .lfld input:focus{border-color:var(--green)}
  .lerr{color:var(--red);font-size:12.5px;margin:-4px 0 14px;display:none}
  .lbtn{width:100%;border:1px solid var(--green);border-radius:6px;padding:12px;font-size:14px;font-weight:700;
    cursor:pointer;background:var(--green-d);color:#fff;font-family:var(--body);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
  .lbtn:hover{background:var(--green)}
  .lbtn:disabled{opacity:.5;cursor:wait}
  .lfooter{text-align:center;color:var(--mut);font-size:11px;margin-top:22px;font-family:var(--mono)}
</style>
</head>
<body>
<canvas id="dotfield"></canvas>
<svg id="dotfieldGlow">
  <defs><radialGradient id="dotGlowGrad"><stop offset="0%" stop-color="#63B546"></stop><stop offset="100%" stop-color="transparent"></stop></radialGradient></defs>
  <circle id="dotGlowCircle" cx="-9999" cy="-9999" r="90" fill="url(#dotGlowGrad)" style="opacity:0"></circle>
</svg>
<div class="loginbox">
  <img class="logo" src="{{ url_for('static', filename='logo.png') }}" alt="CRV Industrial">
  <h1>Gestão de Peças <em style="color:var(--green);font-style:normal">CH570</em></h1>
  <div class="sub">CRV Industrial · Unidade Capinópolis/MG</div>
  <form id="loginForm" autocomplete="on">
    <div class="lfld"><label>Usuário</label><input id="username" name="username" autocomplete="username" autofocus></div>
    <div class="lfld"><label>Senha</label><input id="password" name="password" type="password" autocomplete="current-password"></div>
    <div class="lerr" id="lerr"></div>
    <button class="lbtn" id="btnLogin" type="submit">Entrar</button>
  </form>
  <div class="lfooter">Catálogo CH570 · CRV Industrial</div>
</div>
<script>
(function () {
  // fundo animado (porte em JS puro do componente "DotField" do React Bits — sem React aqui)
  const canvas = document.getElementById('dotfield');
  const glowCircle = document.getElementById('dotGlowCircle');
  const ctx = canvas.getContext('2d', { alpha: true });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const TWO_PI = Math.PI * 2;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const cfg = {
    dotRadius: 1.5,
    dotSpacing: 14,
    cursorRadius: 250,
    bulgeStrength: 67,
    gradientFrom: 'rgba(99, 181, 70, 0.32)',
    gradientTo: 'rgba(46, 90, 47, 0.1)',
  };

  let dots = [];
  let size = { w: 0, h: 0 };
  const mouse = { x: -9999, y: -9999, prevX: -9999, prevY: -9999, speed: 0 };
  let glowOpacity = 0;
  let engagement = 0;
  let resizeTimer;

  function buildDots(w, h) {
    const step = cfg.dotRadius + cfg.dotSpacing;
    const cols = Math.floor(w / step);
    const rows = Math.floor(h / step);
    const padX = (w % step) / 2;
    const padY = (h % step) / 2;
    const list = new Array(rows * cols);
    let idx = 0;
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const ax = padX + col * step + step / 2;
        const ay = padY + row * step + step / 2;
        list[idx++] = { ax, ay, sx: ax, sy: ay };
      }
    }
    dots = list;
  }

  function doResize() {
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    size = { w, h };
    buildDots(w, h);
  }
  function resize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(doResize, 100);
  }

  function onMouseMove(e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  }

  setInterval(() => {
    const dx = mouse.prevX - mouse.x;
    const dy = mouse.prevY - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    mouse.speed += (dist - mouse.speed) * 0.5;
    if (mouse.speed < 0.001) mouse.speed = 0;
    mouse.prevX = mouse.x;
    mouse.prevY = mouse.y;
  }, 20);

  function drawStatic() {
    const { w, h } = size;
    ctx.clearRect(0, 0, w, h);
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, cfg.gradientFrom);
    grad.addColorStop(1, cfg.gradientTo);
    ctx.fillStyle = grad;
    const rad = cfg.dotRadius / 2;
    ctx.beginPath();
    for (const d of dots) { ctx.moveTo(d.ax + rad, d.ay); ctx.arc(d.ax, d.ay, rad, 0, TWO_PI); }
    ctx.fill();
  }

  function tick() {
    const { w, h } = size;
    const len = dots.length;

    const targetEngagement = Math.min(mouse.speed / 5, 1);
    engagement += (targetEngagement - engagement) * 0.06;
    if (engagement < 0.001) engagement = 0;

    glowOpacity += (engagement - glowOpacity) * 0.08;
    glowCircle.setAttribute('cx', mouse.x);
    glowCircle.setAttribute('cy', mouse.y);
    glowCircle.style.opacity = glowOpacity;

    ctx.clearRect(0, 0, w, h);
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, cfg.gradientFrom);
    grad.addColorStop(1, cfg.gradientTo);
    ctx.fillStyle = grad;

    const cr = cfg.cursorRadius;
    const crSq = cr * cr;
    const rad = cfg.dotRadius / 2;

    ctx.beginPath();
    for (let i = 0; i < len; i++) {
      const d = dots[i];
      const dx = mouse.x - d.ax;
      const dy = mouse.y - d.ay;
      const distSq = dx * dx + dy * dy;

      if (distSq < crSq && engagement > 0.01) {
        const dist = Math.sqrt(distSq);
        const t = 1 - dist / cr;
        const push = t * t * cfg.bulgeStrength * engagement;
        const angle = Math.atan2(dy, dx);
        d.sx += (d.ax - Math.cos(angle) * push - d.sx) * 0.15;
        d.sy += (d.ay - Math.sin(angle) * push - d.sy) * 0.15;
      } else {
        d.sx += (d.ax - d.sx) * 0.1;
        d.sy += (d.ay - d.sy) * 0.1;
      }

      ctx.moveTo(d.sx + rad, d.sy);
      ctx.arc(d.sx, d.sy, rad, 0, TWO_PI);
    }
    ctx.fill();

    requestAnimationFrame(tick);
  }

  doResize();
  window.addEventListener('resize', resize);
  if (!reduceMotion) {
    window.addEventListener('mousemove', onMouseMove, { passive: true });
    requestAnimationFrame(tick);
  } else {
    drawStatic();
  }
})();

const $ = s => document.querySelector(s);
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = m => { $('#lerr').textContent = m; $('#lerr').style.display = 'block'; };
  const username = $('#username').value.trim();
  const password = $('#password').value;
  if (!username || !password) return err('Informe usuário e senha.');
  $('#btnLogin').disabled = true;
  $('#lerr').style.display = 'none';
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      return err(j.error || 'Falha ao entrar.');
    }
    window.location.href = '/';
  } catch (e2) {
    err('Falha de conexão: ' + e2.message);
  } finally {
    $('#btnLogin').disabled = false;
  }
});
</script>
</body>
</html>
